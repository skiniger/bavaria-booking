name: Docker Image CI

on:
  push:
    branches: [ "feat/initial-restaurant-pension-management-structure" ]
  pull_request:
    branches: [ "feat/initial-restaurant-pension-management-structure" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    # Baut dieselben Images wie lokal `docker compose up` (backend + frontend,
    # jeweils mit eigenem Dockerfile) – ein Dockerfile im Repo-Root gibt es nicht.
    - name: Build the Docker images
      run: docker compose build
